<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Ingrediente</title>
    <link rel="stylesheet" href="/static/cores.css">

</head>
<body>

    <h1>Editar ingrediente</h1>

    <form action="/ingredientes/atualizar/{{ ingrediente[0] }}" method="POST">

        <label>Nome:</label>
        <input type="text" name="nome" value="{{ ingrediente[1] }}" required>
        <br><br>

        <label>Unidade:</label>
        <input type="text" name="unidade" value="{{ ingrediente[2] }}" required>
        <br><br>

        <label>Estoque:</label>
        <input type="number" name="estoque" value="{{ ingrediente[3] }}" min="0" required>
        <br><br>

        <label>Data de validade:</label>
        <input type="date" name="data_validade" value="{{ ingrediente[4] }}" required>
        <br><br>

        <button type="submit">Salvar alterações</button>

    </form>

    <br>
    <a href="/ingredientes">Voltar para ingredientes</a>

</body>
</html>
